<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>VoidTech Admin</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#06040d;color:#ece8ff;font:15px/1.5 system-ui,sans-serif;padding:20px;max-width:900px;margin:auto}
h1{font-size:1.4rem;margin-bottom:6px}h2{font-size:1.1rem;margin:28px 0 10px;color:#2df2ff}p,small{color:#9d93c4}
section,.box{background:#100b1f;border:1px solid #2a1f4d;border-radius:14px;padding:16px;margin-top:12px}
input{width:100%;background:#0a0716;color:#ece8ff;border:1px solid #2a1f4d;border-radius:10px;padding:10px;font:inherit}
label{display:block;font-size:.8rem;color:#9d93c4;margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;border-top:1px solid #2a1f4d;padding:12px 0;align-items:end}
button{background:linear-gradient(120deg,#7a2cff,#ff2d95);color:#fff;border:0;border-radius:99px;padding:10px 18px;font:700 .9rem system-ui;cursor:pointer;margin:8px 8px 0 0}
button.x{background:#2a1f4d}button.d{background:#5a1030}
img{width:64px;height:90px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px;background:#0a0716}
#bar{position:sticky;bottom:12px;background:#100b1f;border:1px solid #2df2ff;border-radius:14px;padding:12px;margin-top:20px;display:none}
#msg{color:#ffb23e}
</style></head><body>
<h1>VoidTech Admin</h1><p>Edit the site, then press <b>Save to site</b>. Changes go live in 1 to 2 minutes.</p>
<div class="box" id="login">
<label>GitHub repo (owner/name)</label><input id="repo" placeholder="yourname/voidtech">
<label>Branch</label><input id="branch" value="main">
<label>GitHub token (stays in this browser only)</label><input id="token" type="password" placeholder="github_pat_...">
<button id="go">Connect</button><small id="lerr"></small></div>
<div id="app"></div>
<div id="bar"><span id="msg"></span><br><button id="save">Save to site</button></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SEC={
 social:["Social links",[["name","Name"],["url","Link (https://...)"]]],
 products:["Products",[["name","Name"],["desc","Description"],["img","Photo","img"]]],
 games:["PS4 games",[["name","Title"],["cat","Category (e.g. Action)"],["img","Cover","img"]]],
 services:["Services",[["icon","Icon (emoji)"],["title","Title"],["desc","Description"]]],
 reviews:["Testimonials",[["quote","Review"],["name","Customer"],["role","Role"]]]
};
let C=JSON.parse(localStorage.getItem("vt")||"{}"),D=null,sha=null,PREV={};
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,""))));
const say=m=>{$("#bar").style.display="block";$("#msg").textContent=m};
const gh=(p,o={})=>fetch(`https://api.github.com/repos/${C.repo}/contents/${p}`+(o.method?"":`?ref=${C.branch}&t=${Date.now()}`),{...o,headers:{Authorization:"Bearer "+C.token,Accept:"application/vnd.github+json"}});
$("#repo").value=C.repo||"";$("#branch").value=C.branch||"main";$("#token").value=C.token||"";
$("#go").onclick=async()=>{C={repo:$("#repo").value.trim(),branch:$("#branch").value.trim()||"main",token:$("#token").value.trim()};
 $("#lerr").textContent="Connecting...";
 try{const r=await gh("data.json");if(!r.ok)throw r.status;const j=await r.json();sha=j.sha;D=JSON.parse(dec(j.content));localStorage.setItem("vt",JSON.stringify(C));$("#login").style.display="none";draw()}
 catch(e){$("#lerr").textContent="Could not connect (error "+e+"). Check repo name, branch and token permissions."}};
function draw(){D.settings=D.settings||{};
 let h=`<h2>Settings</h2><section><label>WhatsApp number (digits only, country code first)</label><input data-s="settings" data-k="whatsapp" value="${esc(D.settings.whatsapp)}">
 <label>TMDB key (for live new movies)</label><input data-s="settings" data-k="tmdbKey" value="${esc(D.settings.tmdbKey)}"></section>`;
 for(const s in SEC){D[s]=D[s]||[];h+=`<h2>${SEC[s][0]}</h2><section>`;
  D[s].forEach((it,i)=>{h+=`<div class="row">`;
   SEC[s][1].forEach(([k,l,t])=>{h+=t?`<div>${it[k]?`<img src="${esc(PREV[it[k]]||it[k])}" alt="">`:""}<label>${l}</label><input type="file" accept="image/*" data-up="${s}" data-i="${i}" data-k="${k}"></div>`:`<div><label>${l}</label><input data-s="${s}" data-i="${i}" data-k="${k}" value="${esc(it[k])}"></div>`});
   h+=`<div><button class="d" data-del="${s}" data-i="${i}">Delete</button></div></div>`});
  h+=`<button class="x" data-add="${s}">+ Add new</button></section>`}
 $("#app").innerHTML=h;say("Connected. Make changes, then save.")}
$("#app").addEventListener("input",e=>{const d=e.target.dataset;if(d.s==="settings")D.settings[d.k]=e.target.value;else if(d.s)D[d.s][d.i][d.k]=e.target.value});
$("#app").addEventListener("click",e=>{const d=e.target.dataset;
 if(d.add){D[d.add].push({});draw()}
 if(d.del&&confirm("Delete this item?")){D[d.del].splice(d.i,1);draw()}});
$("#app").addEventListener("change",async e=>{const d=e.target.dataset;if(!d.up||!e.target.files[0])return;
 say("Uploading image...");
 try{const bm=await createImageBitmap(e.target.files[0]),sc=Math.min(1,700/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
  c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",.82),name=(D[d.up][d.i].name||D[d.up][d.i].title||"item").toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,30),path=`images/${name}-${Date.now().toString(36)}.jpg`;
  const r=await gh(path,{method:"PUT",body:JSON.stringify({message:"Add image "+path,content:url.split(",")[1],branch:C.branch})});if(!r.ok)throw r.status;
  D[d.up][d.i][d.k]=path;PREV[path]=url;draw();say("Image uploaded. Press Save to site to finish.")}
 catch(err){say("Image upload failed (error "+err+"). Check the token has Contents: read and write.")}});
$("#save").onclick=async()=>{say("Saving...");
 try{const r=await gh("data.json",{method:"PUT",body:JSON.stringify({message:"Update site content",content:enc(JSON.stringify(D,null,1)),sha,branch:C.branch})});
  if(!r.ok)throw r.status;sha=(await r.json()).content.sha;say("Saved. Your site updates in 1 to 2 minutes.")}
 catch(err){say("Save failed (error "+err+"). If 409, reload this page and try again.")}};
if(C.token&&C.repo)$("#go").click();
</script></body></html>
